[package]
name = "canvas-html"
description = "Runs SignalRGB-format HTML effects natively: meta properties, embedded JS, Canvas 2D in Rust. No browser engine."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
canvas-proto.workspace = true
thiserror.workspace = true
tracing.workspace = true
rquickjs = { version = "0.14", features = ["classes", "array-buffer", "parallel"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
