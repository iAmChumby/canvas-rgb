<head>
  <title>Wet Smear</title>
  <meta description="Wide loaded brushes drag thick pigment across the case, pick up the wet paint underneath and smear it into streaks that slowly blend." />
  <meta thumbnail warm_up="20" loop="16" />
  <meta property="ground" label="Ground" type="color" default="#0c1020" />
  <meta property="paint1" label="Paint 1" type="color" default="#2b3fe0" />
  <meta property="paint2" label="Paint 2" type="color" default="#e5337a" />
  <meta property="paint3" label="Paint 3" type="color" default="#ff9a1f" />
  <meta property="speed" label="Speed" type="number" min="0" max="100" default="40" />
  <meta property="smear" label="Smear" type="number" min="0" max="100" default="45" />
  <meta property="seed" label="Seed" type="number" min="0" max="999" default="7" />
</head>
<body style="margin: 0; padding: 0">
  <canvas id="stage" width="80" height="50"></canvas>
</body>
<script>
// ---- shared helpers (inlined into every effect in this set) ----
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(a, b, x) {
  var t = (x - a) / (b - a);
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  return t * t * (3 - 2 * t);
}
var _hexCache = {};
function rgbOf(h) {
  var c = _hexCache[h];
  if (c) return c;
  var s = String(h).replace("#", "");
  if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
  var n = parseInt(s, 16);
  if (isNaN(n)) n = 0;
  c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  _hexCache[h] = c;
  return c;
}
function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Seeded value noise. 64x64 tiling lattice for 2D, 256 entries for 1D.
var NT = new Float32Array(4096), N1 = new Float32Array(256);
function seedNoise(seed) {
  var r = mulberry32((seed * 7919 + 13) | 0), i;
  for (i = 0; i < 4096; i++) NT[i] = r();
  for (i = 0; i < 256; i++) N1[i] = r();
}
function noise2(x, y) {
  x += 4096; y += 4096;
  var xi = x | 0, yi = y | 0, xf = x - xi, yf = y - yi;
  var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  var i0 = (xi & 63) + ((yi & 63) << 6), i1 = ((xi + 1) & 63) + ((yi & 63) << 6);
  var j0 = (xi & 63) + (((yi + 1) & 63) << 6), j1 = ((xi + 1) & 63) + (((yi + 1) & 63) << 6);
  var a = NT[i0], b = NT[i1], c = NT[j0], d = NT[j1];
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function noise1(x) {
  x += 4096;
  var xi = x | 0, xf = x - xi, u = xf * xf * (3 - 2 * xf);
  var a = N1[xi & 255], b = N1[(xi + 1) & 255];
  return a + (b - a) * u;
}
// Presents a coarse grid (gw x gh cells of r,g,b triples) as an 80x50 picture: bilinear upsample into
// ImageData and one putImageData. The canvas is 80x50 and the engine scales it up to the lights' canvas.
var PW = 80, PH = 50, IMG = null, PD = null, XI0 = [], XI1 = [], XWT = [], YI0 = [], YI1 = [], YWT = [];
function presentInit(gw, gh) {
  var i, f, i0;
  IMG = ctx.createImageData(PW, PH); PD = IMG.data;
  for (i = 0; i < PW * PH; i++) PD[i * 4 + 3] = 255;
  for (i = 0; i < PW; i++) {
    f = (i + 0.5) * gw / PW - 0.5; if (f < 0) f = 0; i0 = f | 0;
    XI0[i] = i0 * 3; XI1[i] = (i0 + 1 < gw ? i0 + 1 : gw - 1) * 3; XWT[i] = f - i0;
  }
  for (i = 0; i < PH; i++) {
    f = (i + 0.5) * gh / PH - 0.5; if (f < 0) f = 0; i0 = f | 0;
    YI0[i] = i0 * gw * 3; YI1[i] = (i0 + 1 < gh ? i0 + 1 : gh - 1) * gw * 3; YWT[i] = f - i0;
  }
}
// Only the rows with Y % PARTS === part are worked out per call, so one frame pays a quarter of the
// upsample; the sim moves slowly enough that a row a few frames old is not visible.
var PARTS = 4, PART = 0;
function present(ctx, buf, gw, gh) {
  if (!IMG) presentInit(gw, gh);
  var X, Y, o, r0, r1, wy, wx, a0, a1, b0, b1, p, q;
  for (Y = PART; Y < PH; Y += PARTS) {
    o = Y * PW * 4;
    r0 = YI0[Y]; r1 = YI1[Y]; wy = YWT[Y];
    for (X = 0; X < PW; X++) {
      wx = XWT[X]; p = XI0[X]; q = XI1[X];
      a0 = buf[r0 + p]; a1 = buf[r0 + q]; b0 = buf[r1 + p]; b1 = buf[r1 + q];
      a0 += (a1 - a0) * wx; b0 += (b1 - b0) * wx; PD[o] = a0 + (b0 - a0) * wy;
      a0 = buf[r0 + p + 1]; a1 = buf[r0 + q + 1]; b0 = buf[r1 + p + 1]; b1 = buf[r1 + q + 1];
      a0 += (a1 - a0) * wx; b0 += (b1 - b0) * wx; PD[o + 1] = a0 + (b0 - a0) * wy;
      a0 = buf[r0 + p + 2]; a1 = buf[r0 + q + 2]; b0 = buf[r1 + p + 2]; b1 = buf[r1 + q + 2];
      a0 += (a1 - a0) * wx; b0 += (b1 - b0) * wx; PD[o + 2] = a0 + (b0 - a0) * wy;
      o += 4;
    }
  }
  PART = (PART + 1) % PARTS;
  ctx.putImageData(IMG, 0, 0);
}

// Wet Smear for canvas-rgb. Original effect, ships with the app.
var ground = "#0c1020", paint1 = "#2b3fe0", paint2 = "#e5337a", paint3 = "#ff9a1f";
var speed = 40, smear = 45, seed = 7;

var ctx = document.getElementById("stage").getContext("2d");
var GW = 40, GH = 25, CS = 8, K = 24;
// LOOP: the simulation is a fixed, seeded script, so a sim that has run n steps always looks the same.
// A cycle is NS steps (16 s at the default Speed 40). Two sims overlap: the current one is dissolved in
// over the first FADE steps of a cycle while the previous one, still painting, dissolves out. Sim k is
// restarted at step k*NS and lives NS+FADE steps, so the picture at step g and at g+NS is built from
// the same two sim states: frame(g) == frame(g+NS) exactly, after the first cycle. Speed changes how
// many sim steps run per frame, never what a step does.
var NS = 960, FADE = 180;
// The paint is stored as sqrt(colour). Mixing there is darker and more saturated than mixing
// light, which is how pigment behaves: blue dragged through yellow goes to slate, not white.
var OUT = new Float32Array(GW * GH * 3), MIX = new Float32Array(GW * GH * 3);
function enc(v) { return Math.sqrt(v); }
function encRgb(c) { return [enc(c[0]), enc(c[1]), enc(c[2])]; }
var simA = makeSim(), simB = makeSim(), cur = null, old = null, G = 0, T = 0, acc = 0, lastSeed = -1;
function makeSim() { return { F: new Float32Array(GW * GH * 3), brushes: [], rng: null, strokeNo: 0, n: 0 }; }

function simInit(S) {
  S.rng = mulberry32(seed * 31 + 5);
  var g = encRgb(rgbOf(ground));
  for (var i = 0; i < GW * GH; i++) { S.F[i * 3] = g[0]; S.F[i * 3 + 1] = g[1]; S.F[i * 3 + 2] = g[2]; }
  S.brushes = []; S.strokeNo = 0; S.n = 0;
  // Prime the canvas: two strokes already under way.
  spawn(S); S.brushes[0].trav = 150; placeBrush(S.brushes[0]);
  spawn(S); S.brushes[1].trav = 40; placeBrush(S.brushes[1]);
}

function placeBrush(b) {
  b.x = b.sx + b.dx * b.trav;
  b.y = b.sy + b.dy * b.trav;
}

function spawn(S) {
  var rng = S.rng, strokeNo = S.strokeNo;
  var cols = [paint1, paint2, paint3];
  var col = encRgb(rgbOf(cols[(strokeNo + ((strokeNo / 3) | 0)) % 3]));
  var sign = (strokeNo % 2 === 0) ? 1 : -1;
  var ang = (rng() - 0.5) * 0.8;
  var hw = 44 + rng() * 26;
  var y0 = 25 + rng() * 150;
  var b = { dx: sign * Math.cos(ang), dy: sign * Math.sin(ang), hw: hw, total: 420, trav: 0,
            seed: rng() * 200, vk: 0.85 + rng() * 0.3, sl: [] };
  b.sx = 160 - b.dx * 210; b.sy = y0 - b.dy * 210;
  b.x = b.sx; b.y = b.sy;
  for (var k = 0; k < K; k++) b.sl.push([col[0], col[1], col[2]]);
  b.base = col;
  S.brushes.push(b);
  S.strokeNo++;
}

function step(S) {
  var F = S.F, brushes = S.brushes;
  var v = 94 / 60;   // px per step
  var g = encRgb(rgbOf(ground));
  var pick = smear * 0.0016;
  var bi, b, k, i, cx, cy;
  for (bi = brushes.length - 1; bi >= 0; bi--) {
    b = brushes[bi];
    b.trav += v * b.vk;
    b.x = b.sx + b.dx * b.trav; b.y = b.sy + b.dy * b.trav;
    if (b.trav > b.total) { brushes.splice(bi, 1); continue; }
    var px = -b.dy, py = b.dx;          // perpendicular
    var load = 1 - 0.6 * Math.pow(b.trav / b.total, 1.2);
    // each bristle group picks up the wet paint under it
    for (k = 0; k < K; k++) {
      var wk = ((k + 0.5) / K * 2 - 1) * b.hw;
      var sx = b.x + px * wk, sy = b.y + py * wk;
      var gx = (sx / CS) | 0, gy = (sy / CS) | 0;
      if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) continue;
      i = (gy * GW + gx) * 3;
      var d = Math.abs(F[i] - g[0]) + Math.abs(F[i + 1] - g[1]) + Math.abs(F[i + 2] - g[2]);
      var pw = pick * clamp(d / 14, 0, 1);
      var s = b.sl[k];
      s[0] += (F[i] - s[0]) * pw; s[1] += (F[i + 1] - s[1]) * pw; s[2] += (F[i + 2] - s[2]) * pw;
      // a little fresh pigment from the palette keeps the stroke from going to mud
      s[0] += (b.base[0] - s[0]) * 0.006; s[1] += (b.base[1] - s[1]) * 0.006; s[2] += (b.base[2] - s[2]) * 0.006;
    }
    var R = b.hw + 10, L = b.hw * 0.5;
    var x0 = Math.max(0, ((b.x - R) / CS) | 0), x1 = Math.min(GW - 1, ((b.x + R) / CS) | 0);
    var y0 = Math.max(0, ((b.y - R) / CS) | 0), y1 = Math.min(GH - 1, ((b.y + R) / CS) | 0);
    for (cy = y0; cy <= y1; cy++) {
      for (cx = x0; cx <= x1; cx++) {
        var rx = (cx + 0.5) * CS - b.x, ry = (cy + 0.5) * CS - b.y;
        var u = rx * b.dx + ry * b.dy, w = rx * px + ry * py;
        var au = u / L;
        if (au > 1 || au < -1) continue;
        var br = noise1(w * 0.12 + b.seed);
        var aw = (w < 0 ? -w : w) / b.hw + (br - 0.5) * 0.3;
        if (aw > 1) continue;
        var a2 = aw * aw, u2 = au * au, rr = Math.sqrt(Math.sqrt(a2 * a2 + u2 * u2));
        var wgt = smooth(1, 0.8, rr);
        var cov = clamp((load * 1.5 - br * 0.8) * 4, 0, 1) * wgt;
        if (cov <= 0) continue;
        k = clamp(((w / b.hw * 0.5 + 0.5) * K) | 0, 0, K - 1);
        var tone = 1 + (noise1(w * 0.05 + b.seed * 3) - 0.5) * 0.06 + (noise1(w * 0.6 + b.seed) - 0.5) * 0.12;
        var s2 = b.sl[k], a = cov * 0.45;
        i = (cy * GW + cx) * 3;
        F[i] += (s2[0] * tone - F[i]) * a;
        F[i + 1] += (s2[1] * tone - F[i + 1]) * a;
        F[i + 2] += (s2[2] * tone - F[i + 2]) * a;
      }
    }
  }
  // start the next brush once the newest one is far enough along
  if (brushes.length === 0 || brushes[brushes.length - 1].trav > 150) spawn(S);
  // the paint blends slowly and dries back toward the ground
  if ((S.n & 1) === 0) {
    var rate = 0.0225, dry = 0.0007, x, y, c, n;
    for (y = 1; y < GH - 1; y++) {
      for (x = 1; x < GW - 1; x++) {
        i = (y * GW + x) * 3;
        for (c = 0; c < 3; c++) {
          n = (F[i + c - 3] + F[i + c + 3] + F[i + c - GW * 3] + F[i + c + GW * 3]) * 0.25;
          F[i + c] += (n - F[i + c]) * rate + (g[c] - F[i + c]) * dry;
        }
      }
    }
    // the border follows its neighbours so paint does not stick to the edge
    for (x = 0; x < GW; x++) for (c = 0; c < 3; c++) { F[x * 3 + c] = F[(GW + x) * 3 + c]; F[((GH - 1) * GW + x) * 3 + c] = F[((GH - 2) * GW + x) * 3 + c]; }
    for (y = 0; y < GH; y++) for (c = 0; c < 3; c++) { F[y * GW * 3 + c] = F[(y * GW + 1) * 3 + c]; F[(y * GW + GW - 1) * 3 + c] = F[(y * GW + GW - 2) * 3 + c]; }
  }
  S.n++;
}

// one sim step for the whole system: the clock T (0..NS) counts steps
function advance() {
  step(cur);
  if (old) { step(old); if (old.n >= NS + FADE) old = null; }
  T++;
  if (T >= NS) {
    T = 0; old = cur; cur = (old === simA) ? simB : simA; simInit(cur);
  }
}

function draw() {
  if (seed !== lastSeed) {
    lastSeed = seed; T = 0; acc = 0; old = null; cur = simA; simInit(cur);
  }
  acc += speed <= 0 ? 0 : (150 + speed * 8) / 470;   // sim steps per frame; exactly 1 at Speed 40
  while (acc >= 0.999999) { acc -= 1; advance(); }
  var i, F = cur.F;
  if (old && T < FADE) {
    var w = smooth(0, FADE, T), O = old.F;
    for (i = 0; i < OUT.length; i++) { var m = O[i] + (F[i] - O[i]) * w; OUT[i] = m * m; }
  } else {
    for (i = 0; i < OUT.length; i++) OUT[i] = F[i] * F[i];
  }
  present(ctx, OUT, GW, GH);
  window.requestAnimationFrame(draw);
}
window.requestAnimationFrame(draw);
</script>
