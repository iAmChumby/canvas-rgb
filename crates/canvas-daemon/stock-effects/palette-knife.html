<head>
  <title>Palette Knife</title>
  <meta description="Flat slabs of colour laid down with a palette knife, with raised seams and knife streaks. A finished canvas hangs for a while, then a new one is laid over it slab by slab." />
  <meta thumbnail warm_up="0.5" loop="6" crossfade="8" />
  <meta property="colour1" label="Colour 1" type="color" default="#e2583e" />
  <meta property="colour2" label="Colour 2" type="color" default="#12a39b" />
  <meta property="colour3" label="Colour 3" type="color" default="#f1b24a" />
  <meta property="colour4" label="Colour 4" type="color" default="#2f45a8" />
  <meta property="speed" label="Speed" type="number" min="0" max="100" default="30" />
  <meta property="slabs" label="Slabs" type="number" min="3" max="12" step="1" default="7" />
  <meta property="seed" label="Seed" type="number" min="0" max="999" default="9" />
</head>
<body style="margin: 0; padding: 0">
  <canvas id="stage" width="80" height="50"></canvas>
</body>
<script>
// ---- shared helpers (inlined into every effect in this set) ----
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(a, b, x) {
  var t = (x - a) / (b - a);
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  return t * t * (3 - 2 * t);
}
var _hexCache = {};
function rgbOf(h) {
  var c = _hexCache[h];
  if (c) return c;
  var s = String(h).replace("#", "");
  if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
  var n = parseInt(s, 16);
  if (isNaN(n)) n = 0;
  c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  _hexCache[h] = c;
  return c;
}
function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Seeded value noise. 64x64 tiling lattice for 2D, 256 entries for 1D.
var NT = new Float32Array(4096), N1 = new Float32Array(256);
function seedNoise(seed) {
  var r = mulberry32((seed * 7919 + 13) | 0), i;
  for (i = 0; i < 4096; i++) NT[i] = r();
  for (i = 0; i < 256; i++) N1[i] = r();
}
function noise2(x, y) {
  x += 4096; y += 4096;
  var xi = x | 0, yi = y | 0, xf = x - xi, yf = y - yi;
  var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  var i0 = (xi & 63) + ((yi & 63) << 6), i1 = ((xi + 1) & 63) + ((yi & 63) << 6);
  var j0 = (xi & 63) + (((yi + 1) & 63) << 6), j1 = ((xi + 1) & 63) + (((yi + 1) & 63) << 6);
  var a = NT[i0], b = NT[i1], c = NT[j0], d = NT[j1];
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function noise1(x) {
  x += 4096;
  var xi = x | 0, xf = x - xi, u = xf * xf * (3 - 2 * xf);
  var a = N1[xi & 255], b = N1[(xi + 1) & 255];
  return a + (b - a) * u;
}
// The picture is drawn straight into an 80x50 ImageData (one cell is one pixel; the engine scales the
// 80x50 canvas up to the lights' canvas) and put on the canvas in one call. Drawing a whole picture in
// one frame cost 20-40 ms, so the rows are split over SLICES frames: frame s works out the rows with
// gy % SLICES === s, and the last slice puts the picture on the canvas. A frame therefore costs about
// 1/SLICES of a picture; every row is refreshed once per SLICES frames (7.5 Hz at 60 fps).
var SLICES = 8;
function makeImage(ctx, w, h) {
  var img = ctx.createImageData(w, h), d = img.data, i;
  for (i = 3; i < d.length; i += 4) d[i] = 255;
  return img;
}

// Palette Knife for canvas-rgb. Original effect, ships with the app.
var colour1 = "#e2583e", colour2 = "#12a39b", colour3 = "#f1b24a", colour4 = "#2f45a8";
var speed = 30, slabs = 7, seed = 9;

var ctx = document.getElementById("stage").getContext("2d");
var GW = 80, GH = 50, CS = 4;
var IMG = makeImage(ctx, GW, GH), PD = IMG.data;
var F = 0, T = 0, lastSeed = -1, lastSlabs = -1, cache = {};
// LOOP: three paintings take turns: hold, then the next is laid over it slab by slab, and after the
// third comes the first again. One cycle is C = 3 * 8.0 = 24 T-units (24 s at the default Speed 30).
// The slab drift is sin/cos of whole multiples of 2*pi*T/C, so every position repeats at C.
var HOLD = 4.8, TRANS = 3.2, PERIOD = HOLD + TRANS, NCAN = 3, C = NCAN * PERIOD, W1 = 6.283185307179586 / C;
var EV = [0, 0, 0, 0, 0];   // scratch result: r, g, b, d1, d2

// Canvas k is a set of sites, each the start of one slab. It is made from the seed and k alone.
function canvasInfo(k) {
  var c = cache[k];
  if (c) return c;
  var r = mulberry32(seed * 1259 + k * 71 + 5), n = Math.round(slabs), i, j;
  var ang = (r() - 0.5) * 1.1 + (r() < 0.3 ? 1.2 : 0);
  c = { ca: Math.cos(ang), sa: Math.sin(ang), aniso: 1.8 + r() * 1.2, sx: [], sy: [], col: [], sd: [], ph: [], delay: [] };
  var order = [0, 1, 2, 3], w = [0.4, 0.27, 0.2, 0.13];
  for (i = 3; i > 0; i--) { j = (r() * (i + 1)) | 0; var t = order[i]; order[i] = order[j]; order[j] = t; }
  for (i = 0; i < n; i++) {
    var bx = 0, by = 0, best = -1;
    for (var tries = 0; tries < 8; tries++) {
      var x = -10 + r() * 340, y = -10 + r() * 220, m = 1e9;
      for (j = 0; j < i; j++) { var d = (x - c.sx[j]) * (x - c.sx[j]) + (y - c.sy[j]) * (y - c.sy[j]); if (d < m) m = d; }
      if (m > best) { best = m; bx = x; by = y; }
    }
    c.sx.push(bx); c.sy.push(by);
    var u = r(), acc = 0, pick = 0;
    for (j = 0; j < 4; j++) { acc += w[j]; if (u < acc) { pick = order[j]; break; } pick = order[3]; }
    if (i > 0 && pick === c.col[i - 1] && r() < 0.7) pick = (pick + 1 + ((r() * 3) | 0)) % 4;
    c.col.push(pick); c.sd.push(r() * 100); c.ph.push(r() * 6.28); c.delay.push(r() * 1.5);
  }
  cache[k] = c;
  return c;
}

// Per-draw slab state for canvas c at clock T: the drift of every site and its tone breathing. They
// depend on the site and on T only, so they are worked out once per frame instead of once per cell.
function prepCanvas(c, T) {
  var n = c.sx.length, i;
  if (!c.ox) { c.ox = []; c.oy = []; c.br = []; }
  for (i = 0; i < n; i++) {
    c.ox[i] = Math.sin(T * W1 + c.ph[i]) * 9;
    c.oy[i] = Math.cos(T * W1 + c.ph[i]) * 7;
    c.br[i] = Math.sin(T * 2 * W1 + c.ph[i]) * 0.035;
  }
}

// Distance to the nearest site of canvas c at (x, y) and that site's index, left in ND and NB. This is the
// first part of evalCanvas on its own, for cells the growing canvas has not reached yet.
var ND = 0, NB = 0;
function nearestSite(c, x, y) {
  var n = c.sx.length, i, d1 = 1e18, bi = 0, sx = c.sx, sy = c.sy, ox = c.ox, oy = c.oy;
  var ca = c.ca, sa = c.sa, an = c.aniso;
  for (i = 0; i < n; i++) {
    var dx = x - sx[i] - ox[i], dy = y - sy[i] + oy[i];
    var u = (dx * ca + dy * sa) / an, v = -dx * sa + dy * ca;
    var d = u * u + v * v;
    if (d < d1) { d1 = d; bi = i; }
  }
  ND = Math.sqrt(d1); NB = bi;
}

// Colour of canvas c at (x, y). Leaves r, g, b, nearest-site distance and the runner-up in EV.
function evalCanvas(c, x, y, pal) {
  var n = c.sx.length, i, d1 = 1e18, d2 = 1e18, bi = 0, sx = c.sx, sy = c.sy, ox = c.ox, oy = c.oy;
  var ca = c.ca, sa = c.sa, an = c.aniso;
  for (i = 0; i < n; i++) {
    var dx = x - sx[i] - ox[i], dy = y - sy[i] + oy[i];
    var u = (dx * ca + dy * sa) / an, v = -dx * sa + dy * ca;
    var d = u * u + v * v;   // squared: the order of distances is the same, so the root is taken only twice
    if (d < d1) { d2 = d1; d1 = d; bi = i; } else if (d < d2) d2 = d;
  }
  d1 = Math.sqrt(d1);
  var col = pal[c.col[bi]];
  // knife streaks run along the slab; the pigment never lies perfectly flat
  var v2 = -(x * sa) + y * ca;
  var tone = 1 + (noise1(v2 * 0.16 + c.sd[bi]) - 0.5) * 0.26 + (noise1(v2 * 0.5 + c.sd[bi] * 2) - 0.5) * 0.08 + c.br[bi];
  // The seam only reaches 7 px from the edge; a cell farther than that (d2 > d1 + 7) has ridge 1, so the
  // runner-up's root and the two smoothsteps are skipped there. The result is the same.
  var ridge = 1, lim = d1 + 7;
  if (d2 <= lim * lim) {
    d2 = Math.sqrt(d2);
    var edge = d2 - d1;
    ridge = 1 + 0.22 * smooth(7, 1.5, edge) - 0.2 * smooth(1.6, 0, edge);
  }
  var m = tone * ridge;
  EV[0] = col[0] * m; EV[1] = col[1] * m; EV[2] = col[2] * m; EV[3] = d1; EV[4] = bi;
}

function draw() {
  if (seed !== lastSeed || Math.round(slabs) !== lastSlabs) { seedNoise(seed); cache = {}; lastSeed = seed; lastSlabs = Math.round(slabs); }
  var sp = speed <= 0 ? 0 : 0.25 + speed / 40;
  T += sp / 60;
  T -= C * Math.floor(T / C);
  // The clock above runs every frame; the picture is worked out a slice of rows at a time (see SLICES).
  var slice = F++ % SLICES;
  var pal = [rgbOf(colour1), rgbOf(colour2), rgbOf(colour3), rgbOf(colour4)];
  var k = Math.floor(T / PERIOD), local = T - k * PERIOD;
  var cur = canvasInfo(k), next = canvasInfo((k + 1) % NCAN);
  var growing = local > HOLD, o, gx, gy;
  prepCanvas(cur, T);
  if (growing) prepCanvas(next, T);
  var tp = local - HOLD;
  for (gy = slice; gy < GH; gy += SLICES) {
    var y = (gy + 0.5) * CS;
    o = gy * GW * 4;
    for (gx = 0; gx < GW; gx++) {
      var x = (gx + 0.5) * CS;
      evalCanvas(cur, x, y, pal);
      var r = EV[0], g = EV[1], b = EV[2];
      if (growing) {
        // the next canvas is laid slab by slab: each slab spreads from its own site
        // a cell farther from every next slab than its front can reach (plus the lip) is unchanged
        nearestSite(next, x, y);
        var p = clamp((tp - next.delay[NB]) / (TRANS - 1.6), 0, 1);
        var reach = (1 - Math.pow(1 - p, 2.2)) * 260;
        if (ND <= reach + 7) {
          evalCanvas(next, x, y, pal);
          var nd = EV[3];
          var cover = smooth(reach, reach - 6, nd);    // soft knife edge
          if (cover > 0) { r += (EV[0] - r) * cover; g += (EV[1] - g) * cover; b += (EV[2] - b) * cover; }
          // a bright lip rides the front of the slab as it spreads
          var lip = smooth(7, 0, Math.abs(nd - reach)) * (p > 0 && p < 1 ? 0.22 : 0);
          r *= 1 + lip; g *= 1 + lip; b *= 1 + lip;
        }
      }
      PD[o] = r; PD[o + 1] = g; PD[o + 2] = b; o += 4;
    }
  }
  if (slice === SLICES - 1) ctx.putImageData(IMG, 0, 0);
  window.requestAnimationFrame(draw);
}
window.requestAnimationFrame(draw);
</script>
