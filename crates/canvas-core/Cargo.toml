[package]
name = "canvas-core"
description = "canvas-rgb engine: canvas, layout, sampling, render loop."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
canvas-proto.workspace = true
tracing.workspace = true

[dev-dependencies]
# The scenes benchmark measures what a frame with many groups costs, so it needs the
# effect library and the HTML runtime. Neither depends on canvas-core, so there is no
# cycle and the traits are the same ones.
canvas-effects.workspace = true
canvas-html.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media", "Win32_System_Threading"] }
