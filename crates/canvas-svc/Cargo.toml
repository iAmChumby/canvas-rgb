[package]
name = "canvas-svc"
description = "canvas-rgb-svc.exe: Windows service for fans (PawnIO, NCT6687D-R) and the OpenRGB server."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "canvas_svc"
path = "src/lib.rs"

[[bin]]
name = "canvas-rgb-svc"
path = "src/main.rs"

# Read-only BIOS fan-curve probe (run by hand, elevated, with the service stopped). `test = true`
# so its decoder tests run with `cargo test -p canvas-svc`.
[[example]]
name = "bios_curve_probe"
test = true

[dependencies]
canvas-proto.workspace = true
canvas-adapters.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
libloading = "0.8"
base64 = "0.22"
minisign-verify = "0.3"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
tempfile = "3"
