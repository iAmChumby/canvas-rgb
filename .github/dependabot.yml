# Dependabot keeps the dependencies moving (#167).
#
# Dependabot proposes version bumps; it approves nothing. A bump of a dependency that is
# already in docs/dependencies.md needs no new row (the ledger check looks at the names, not
# the versions), and a new dependency still needs the audit summary and Luke's yes.
#
# One group per ecosystem, so a week of bumps arrives as one pull request instead of a dozen.
version: 2
updates:
  # The Rust workspace: the root Cargo.toml holds the workspace, so "/" covers every crate.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # windows-core has to move together with the `windows` crate: the daemon's
      # #[implement] code compiles against both. `windows` has no release past 0.62.2
      # (crates.io, 2026-11-18), so windows-core 0.100 cannot build next to it. Remove this
      # ignore when a `windows` release depends on windows-core 0.100.
      - dependency-name: "windows-core"
        versions: [">=0.100.0"]

  # The npm projects. They do not depend on each other, so each has its own entry.
  - package-ecosystem: npm
    directory: "/app/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 (the native compiler) passes `tsc`, but `eslint .` fails with
      # "typescript-eslint does not support TS 7.0" (typescript-eslint 8.73.0 peers
      # typescript <6.1.0; its TS 7 support is tracked in typescript-eslint issue 10940).
      # The editor build runs lint, so it stays on 5.9.x. Remove this ignore when
      # typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/tools/signer"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/tools/poison-compare/js"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"

  # The GitHub Actions, in the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
