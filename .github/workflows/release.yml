name: Release

# Push a tag like v0.1.0: this builds canvas-rgb-setup-0.1.0.exe and attaches it to the GitHub release.
# The installer is NOT code-signed, so Windows SmartScreen warns on first run ("Windows protected your PC":
# More info, then Run anyway). Compare the SHA-256 below with the one in the job log before running it.
# Every third-party action is pinned to a full commit SHA (tag in the comment). The build job is read-only;
# only the small upload job holds contents: write. The update signing key lives in the sign job alone.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Tag matches the workspace version
        shell: pwsh
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch '(?ms)\[workspace\.package\].*?^\s*version\s*=\s*"([^"]+)"') { throw 'no workspace version' }
          $want = "v$($Matches[1])"
          if ($env:GITHUB_REF_NAME -ne $want) { throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $want" }

      - name: Every copy of the version matches
        shell: pwsh
        run: pwsh -NoProfile -File tools/set-version.ps1 -Check

      - name: The changelog has this version
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          if ((Get-Content CHANGELOG.md -Raw) -notmatch "(?m)^## \[$([regex]::Escape($v))\] - \d{4}-\d{2}-\d{2}") { throw "CHANGELOG.md has no '## [$v] - YYYY-MM-DD' section" }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - run: npm ci
        working-directory: app/web

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Installer tests
        shell: pwsh
        run: pwsh -NoProfile -File installer/tests/run-all.ps1

      # No Inno Setup action is used: the Chocolatey package is installed directly (see the report: not hash-pinned).
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --version 6.7.1 --no-progress -y # the version the installer was built and tested with locally

      # Web build, cargo release build, payload staging and ISCC, in one script.
      - name: Build the installer
        shell: pwsh
        run: powershell -NoProfile -File tools/build-installer.ps1

      - name: SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter 'canvas-rgb-setup-*.exe' | Select-Object -First 1
          $h = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          Write-Host "$h  $($exe.Name)"
          "### SHA-256`n`n``$h  $($exe.Name)``" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Set-Content -Path "dist/$($exe.Name).sha256" -Value "$h  $($exe.Name)" -Encoding ascii

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer
          path: |
            dist/canvas-rgb-setup-*.exe
            dist/canvas-rgb-setup-*.exe.sha256
          if-no-files-found: error

  # The only job that sees the update signing key. It runs no project build code: it installs the Tauri CLI
  # from a committed lockfile (integrity hashes, no install scripts) and signs the exe the build job made,
  # after checking that exe against the build job's .sha256. windows-latest: the same runner image as the
  # build, so the win32-x64 CLI binary the lockfile pins is the one that runs (and make-update-manifest.ps1
  # was written and tested for Windows PowerShell).
  # The tray's updater trusts one minisign key. The signature carries the version (--app-version), so a
  # tampered latest.json cannot pair a new version number with an older signed installer.
  # The private key is the UPDATE_SIGNING_KEY secret (backup: outside the repo, see docs/releasing.md).
  sign:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Only the signer pin, the changelog and the manifest script: nothing that builds the project.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/signer
            tools/make-update-manifest.ps1
            CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer
          path: dist

      - name: Checksum still matches
        shell: pwsh
        run: |
          $sums = @(Get-ChildItem dist -Filter 'canvas-rgb-setup-*.exe.sha256')
          if ($sums.Count -ne 1) { throw "expected one .sha256, found $($sums.Count)" }
          $line = (Get-Content -LiteralPath $sums[0].FullName -Raw).Trim()
          if ($line -notmatch '^([0-9a-f]{64})  (canvas-rgb-setup-[0-9.]+\.exe)$') { throw "unreadable checksum line: $line" }
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path dist $Matches[2])).Hash.ToLowerInvariant()
          if ($got -ne $Matches[1]) { throw "SHA-256 mismatch for $($Matches[2]): $got" }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Lockfile-pinned, hash-checked, no lifecycle scripts, no npx.
      - name: Install the pinned Tauri CLI
        shell: pwsh
        timeout-minutes: 5
        run: |
          npm ci --ignore-scripts --prefix tools/signer
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed ($LASTEXITCODE)" }

      # The key is in this one step's environment and nowhere else in the workflow's build path.
      - name: Sign the installer for the updater
        shell: pwsh
        timeout-minutes: 5 # a signing run takes seconds; a prompt must not hold the release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'the UPDATE_SIGNING_KEY secret is not set' }
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $exe = Get-ChildItem dist -Filter 'canvas-rgb-setup-*.exe' | Select-Object -First 1
          & "$PWD/tools/signer/node_modules/.bin/tauri.cmd" signer sign --app-version $v $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "signer sign failed ($LASTEXITCODE)" }
          if (-not (Test-Path "$($exe.FullName).sig")) { throw 'no .sig file was written' }

      - name: Write latest.json
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          pwsh -NoProfile -File tools/make-update-manifest.ps1 -Version $v -SigFile "dist/canvas-rgb-setup-$v.exe.sig" -OutFile dist/latest.json
          if ($LASTEXITCODE -ne 0) { throw 'make-update-manifest.ps1 failed' }
          Get-Content dist/latest.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signature
          path: |
            dist/canvas-rgb-setup-*.exe.sig
            dist/latest.json
          if-no-files-found: error

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only job that can write to the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signature
          path: dist

      - name: Checksum still matches
        run: cd dist && sha256sum -c *.sha256

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/canvas-rgb-setup-*.exe
            dist/canvas-rgb-setup-*.exe.sha256
            dist/canvas-rgb-setup-*.exe.sig
            dist/latest.json
          generate_release_notes: true
