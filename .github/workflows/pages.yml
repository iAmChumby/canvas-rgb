name: Pages

# The site is a static export of site/, built from the editor's own components. It goes live
# when the site's files or the editor's source change, and when the Release workflow asks for a
# build: the install section prints the installer's SHA-256, read from the release's own
# .sha256 asset when the site is built, so the site can only be built once the release exists
# (#83).
on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "app/web/src/**"
  # The Release workflow starts this build itself, after it has attached the .sha256 to the
  # release: a "release: published" event cannot do it, because the release is published with
  # GITHUB_TOKEN and GitHub does not start workflows from events that token creates.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # The hash read is its own job and has NO concurrency group. GitHub keeps one pending run per
  # group and a newly queued run replaces it (GitHub docs, workflow syntax, "concurrency": "By
  # default, any existing pending job or workflow in the same concurrency group will be
  # canceled and the new queued job or workflow will take its place."). A push that skips must therefore never
  # enter the group: if it did, it would replace the Release workflow's pending dispatch, find
  # no asset for the new version, skip, and the released page would never deploy. Only the jobs
  # that run when the read did not skip (build, deploy) are in the group.
  read:
    runs-on: ubuntu-latest
    outputs:
      # "true" when the release for the version the page shows is not out yet: the build and the
      # deploy do not run, and the build the Release workflow starts builds the site once the
      # hash is there.
      skipped: ${{ steps.sha.outputs.skipped }}
      sha256: ${{ steps.sha.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      # The hash the install section prints, read from the release's own .sha256 asset, so the
      # page and the release cannot disagree (#83). A push to main lands before the release for
      # that version exists, so a missing asset is not a failure there: the build and the deploy
      # do not run, and the build the Release workflow starts has the hash.
      - name: Read the installer's SHA-256
        id: sha
        working-directory: site
        env:
          # Only a push may skip. A push to main lands before the release for that version is
          # out, so there is no .sha256 asset to read yet and the deploy waits for the release.
          # A dispatch (the one the Release workflow starts, or a manual one) has to find the
          # asset: it retries, and then fails the run with a clear message when the asset is
          # missing or malformed. A run that goes green without deploying is worse than a red
          # one.
          CANVAS_SETUP_SHA256_SKIP_IF_MISSING: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node scripts/setup-sha.mjs

  build:
    needs: read
    if: needs.read.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    # Builds and deploys queue and never cancel a run that is going: the Release workflow's
    # build of the site must go out, and a push that lands while it runs must not cancel it
    # (GitHub's own Pages workflows queue the same way, actions/starter-workflows
    # pages/static.yml). What it costs: the site's builds are one at a time, and only the newest
    # queued run is kept, which is what a site wants since the newest main is what should be
    # live. A queued push build can replace a queued dispatch only when it was triggered after
    # the dispatch, so its commit is the release commit or a later one, and it skipped nothing:
    # it found its own version's .sha256, so it builds the same version with the same hash, or a
    # newer released one.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/web/package-lock.json
            site/package-lock.json

      # The site imports the editor's components from app/web/src, so the editor's packages
      # are installed too: the TypeScript in the editor's files resolves React from there.
      - name: Install the editor's packages
        run: npm ci
        working-directory: app/web

      - name: Install the site's packages
        run: npm ci
        working-directory: site

      # The hash the read job found, handed on so the page prints exactly that hash (the same
      # commit, so the same version).
      - name: Build the site
        env:
          CANVAS_SETUP_SHA256: ${{ needs.read.outputs.sha256 }}
        run: npm --prefix site run build

      # The built page shows the hash the release carries, and no PowerShell command line
      # anywhere on it (#79).
      - name: Check the install section
        run: npm --prefix site run check-install

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: [read, build]
    if: needs.read.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
