# Third-party Rust notices for the crates that ship in the Windows app (#578).
#
# The accepted list is a copy of deny.toml's [licenses].allow list. cargo-about
# resolves each crate's SPDX expression against this list and `--fail` exits
# non-zero when an expression cannot be satisfied, so CI fails on a licence
# outside the list. Do not add a licence here without changing deny.toml too.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
]

# Only the Windows app's crates are notices: the daemon, service, tray and CLI.
# Build-only crates (tauri-build, native toolchains) and dev-only crates never
# ship, so they are left out. --offline keeps licence reading local.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The workspace's own crates are Apache-2.0 and are not third-party notices.
private = { ignore = true }

# ---------------------------------------------------------------------------
# Clarifications (crate, version, pinned source file and its SHA-256) (#578).
#
# These 24 crates carry licence files in their published crate source, but
# cargo-about's scanner cannot match the file to the declared expression (the
# names are lower-case, or the crate has several licence files). Each entry
# names the real file in the crate's own crates.io package at the locked
# version, and the checksum makes the clarification fail if that file ever
# changes. The text is therefore the crate's own licence text, not a guess.
#
# Seven further Windows-compiled crates ship no licence file at all:
#   alloc-stdlib 0.3.0, rquickjs-core 0.14.0, ts-rs 12.0.1,
#   ts-rs-macros 12.0.1, webview2-com 0.39.1, webview2-com-macros 0.8.1,
#   webview2-com-sys 0.39.1.
# For these, cargo-about uses the SPDX licence text embedded in cargo-about
# 0.9.3 (the spdx/license-list-data texts bundled in that release) for the
# licence the crate declares in Cargo.toml. Their expression is pinned by the
# accepted list above. A git clarification would fetch the upstream file from
# raw.githubusercontent.com, which the --offline gate forbids, so no file
# checksum can be given for them.
# ---------------------------------------------------------------------------
