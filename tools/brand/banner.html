<style>
@font-face { font-family: "Schibsted Grotesk"; src: url("../../app/web/node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2") format("woff2"); font-weight: 400 900; }
@font-face { font-family: "JetBrains Mono"; src: url("../../app/web/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; }
:root { --bg: #0e0f11; --panel: #15171a; --line: rgba(255,255,255,.08); --dot: rgba(255,255,255,.15); --ink: #f2f3f5; --dim: #8a8f98; }
:root[data-theme="light"] { --bg: #f3f4f6; --panel: #ffffff; --line: rgba(15,18,24,.12); --dot: rgba(15,18,24,.2); --ink: #15171a; --dim: #5f6571; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 360px; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.4px);
  background-size: 22px 22px;
  font-family: "Schibsted Grotesk", sans-serif;
  color: var(--ink);
  position: relative; overflow: hidden;
}
.spectrum { position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, #ff3b5c, #ffb02e 25%, #3ddc84 50%, #3b9bff 75%, #b45cff); }
.wrap { position: absolute; inset: 0; display: flex; align-items: center; gap: 56px; padding: 0 96px; }
.tile { flex: none; width: 168px; height: 168px; border-radius: 34px; background: #15171a;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); display: grid; place-items: center; }
.text { display: flex; flex-direction: column; gap: 18px; }
.wordmark { font-size: 96px; font-weight: 650; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
.wordmark svg { display: inline-block; width: 0.62em; height: 0.72em; margin: 0 0.03em 0 0.01em; vertical-align: -0.02em; overflow: visible; }
.rgb { font-family: "JetBrains Mono", monospace; font-weight: 600; margin-left: 2px; letter-spacing: 0;
  background: linear-gradient(90deg, #ff3b5c, #ffb02e, #3ddc84, #3b9bff, #b45cff); -webkit-background-clip: text; color: transparent; }
.tag { font-size: 30px; font-weight: 500; color: var(--dim); letter-spacing: -0.005em; }
.tag b { color: var(--ink); font-weight: 600; }
.legs { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.back { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; opacity: .45; }
</style>
</head>

  <div class="text">
