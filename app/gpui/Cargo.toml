[package]
name = "canvas-rgb-editor"
description = "canvas-rgb-editor.exe: the GPUI editor beside the React editor. Talks HTTP to the daemon only; opens no listening socket."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "canvas-rgb-editor"
path = "src/main.rs"

[dependencies]
canvas-client.workspace = true
canvas-proto.workspace = true
gpui = "=0.2.2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Same client and TLS setup as the tray (app/src-tauri/Cargo.toml).
ureq = { version = "3", default-features = false, features = ["rustls"] }
