[package]
name = "canvas-rgb-tray"
description = "canvas-rgb.exe: Tauri 2 tray app that hosts the editor and fronts the daemon API."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "canvas-rgb"
path = "src/main.rs"

[features]
# Production builds embed app/web/out and serve it over the custom protocol. Plain
# `cargo build` gets that too (the same reason Backlight's Cargo.toml sets it as default).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
canvas-proto.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
# Same client and TLS setup as the daemon's CLI (crates/canvas-daemon/Cargo.toml).
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
