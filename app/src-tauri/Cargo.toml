[package]
name = "canvas-rgb-tray"
description = "canvas-rgb.exe: Tauri 2 tray app that hosts the editor and fronts the daemon API."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "canvas-rgb"
path = "src/main.rs"

[features]
# Production builds embed app/web/out and serve it over the custom protocol. Plain
# `cargo build` gets that too (the same reason Backlight's Cargo.toml sets it as default).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
canvas-proto.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Verify-only: the plugin checks the manifest, downloads and checks the signature; our own code runs the
# installer (app/src-tauri/src/update/). `download_and_install` and `install` are never called.
tauri-plugin-updater = "2"
url = "2"
# The redirect policy for the plugin's client (same version the plugin uses).
reqwest = { version = "0.13", default-features = false }
semver = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
serde.workspace = true
serde_json.workspace = true
# Same client and TLS setup as the daemon's CLI (crates/canvas-daemon/Cargo.toml).
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The update tests run the plugin on tauri's mock runtime, against a fake release server on 127.0.0.1.
tauri = { version = "2", features = ["test"] }
